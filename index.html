<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Cayo Perico • Portal Administrasi</title>
<style>
:root{--bg:#080d19;--panel:#111a2c;--line:#263650;--text:#f3f6ff;--muted:#a6b4ca;--mint:#4de0b7;--purple:#b77cff;}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 15% 0%,#203451 0,transparent 45%),radial-gradient(ellipse at 90% 15%,#30204a 0,transparent 38%),var(--bg);}
button{font:inherit;touch-action:manipulation}
.home{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.shell{width:min(980px,100%);}
.brand{text-align:center;margin:0 auto 30px;}
.mark{width:68px;height:68px;display:grid;place-items:center;margin:0 auto 16px;border-radius:22px;background:linear-gradient(135deg,var(--mint),#268d9c);box-shadow:0 14px 40px #0005;font-size:32px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--mint)}
h1{font-size:clamp(30px,6vw,54px);letter-spacing:-.04em;line-height:1.05;margin:10px 0 12px}
.intro{max-width:560px;margin:0 auto;color:var(--muted);line-height:1.7;font-size:15px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.choice{text-align:left;min-width:0;padding:clamp(20px,4vw,30px);border:1px solid #34435d;border-radius:22px;background:linear-gradient(145deg,#17243aee,#101827ee);color:var(--text);cursor:pointer;box-shadow:0 18px 50px #0002;transition:transform .18s,border-color .18s,box-shadow .18s;}
.choice:hover,.choice:focus-visible{transform:translateY(-3px);border-color:var(--mint);box-shadow:0 22px 55px #0004;outline:none}
.choice.coin:hover,.choice.coin:focus-visible{border-color:var(--purple)}
.choice-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:#153c3a;font-size:27px;margin-bottom:22px}
.coin .choice-icon{background:#34264d}
.choice h2{font-size:clamp(19px,3vw,25px);margin:0 0 8px}
.choice p{color:var(--muted);line-height:1.6;margin:0 0 24px;font-size:14px}
.launch{display:inline-flex;align-items:center;gap:9px;color:var(--mint);font-weight:800;font-size:14px}
.coin .launch{color:#d1a7ff}
.foot{text-align:center;color:#71819a;font-size:12px;margin-top:24px}
.app-view{display:none;min-height:100vh;}
.app-view.active{display:block}
.appbar{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:12px;padding:10px max(12px,env(safe-area-inset-left));background:#0a1020ee;border-bottom:1px solid #263650;backdrop-filter:blur(14px)}
.back{border:1px solid #3a4b65;border-radius:11px;background:#18243a;color:#fff;padding:10px 14px;min-height:42px;font-weight:750;cursor:pointer;white-space:nowrap}
.back:hover{background:#243650}
.app-title{font-size:14px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-subtitle{font-size:11px;color:var(--muted);margin-top:2px}
.app-frame{display:block;width:100%;height:calc(100vh - 64px);height:calc(100dvh - 64px);border:0;background:transparent}
@media(max-width:620px){
 .home{align-items:flex-start;padding:38px 14px 24px}
 .brand{margin-bottom:25px}
 .choices{grid-template-columns:1fr;gap:12px}
 .choice{display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:14px;padding:18px;border-radius:18px}
 .choice-icon{grid-row:1/4;width:50px;height:50px;margin:0;font-size:24px}
 .choice h2{align-self:end;font-size:19px;margin:0 0 5px}
 .choice p{font-size:13px;margin:0 0 12px}
 .launch{font-size:13px}
 .appbar{padding:9px 10px}
 .back{padding:9px 11px;min-height:40px;font-size:13px}
 .app-frame{height:calc(100vh - 60px);height:calc(100dvh - 60px)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Tema biru muda kecokelatan */
:root{--bg:#eaf5fb;--panel:#f8f2e9;--line:#b8cedb;--text:#3e352e;--muted:#76695e;--mint:#6aaed0;--purple:#b78b62;}
html{background:var(--bg)!important}
body{color:var(--text)!important;background:radial-gradient(ellipse at 12% 0%,#cdeafa 0,transparent 48%),radial-gradient(ellipse at 90% 15%,#e9d5bd 0,transparent 42%),var(--bg)!important}
.mark{background:linear-gradient(135deg,#a8d9ef,#b99570)!important}
.eyebrow{color:#598eaa!important}
.intro,.choice p,.app-subtitle{color:#76695e!important}
.choice{background:linear-gradient(145deg,#f8fcffed,#f0e4d5ee)!important;border-color:#c6d6df!important;color:#44382f!important}
.choice:hover,.choice:focus-visible{border-color:#79b8d5!important}
.choice.coin:hover,.choice.coin:focus-visible{border-color:#b99570!important}
.choice-icon{background:#d7edf7!important}
.coin .choice-icon{background:#ead9c5!important}
.launch,.coin .launch{color:#8b6949!important}
.foot{color:#8a7c70!important}
.appbar{background:#edf7fbee!important;border-color:#c4d7e1!important}
.back{background:#d9eaf2!important;border-color:#b6cbd7!important;color:#493c31!important}
.back:hover{background:#c8e2ef!important}
.app-frame{background:#edf6fa!important}

</style>
</head>
<body>
<main id="home" class="home">
 <div class="shell">
  <header class="brand">
   <div class="mark">🗝️</div>
   <div class="eyebrow"></div>
   <h1>Pendataan Koperasi dan Penukaran Koin Cayo</h1>
   <p class="intro">Pilih aplikasi yang ingin dibuka. Untuk berpindah ke aplikasi lainnya, kembali dulu ke halaman awal.</p>
  </header>
  <section class="choices" aria-label="Pilihan aplikasi">
   <button class="choice" type="button" onclick="openApp('expense')">
    <span class="choice-icon">🧮</span>
    <h2>Expense Calculator</h2>
    <p>Catat pengeluaran, hitung total item, dan lihat riwayat transaksi.</p>
    <span class="launch">Buka aplikasi <span aria-hidden="true">→</span></span>
   </button>
   <button class="choice coin" type="button" onclick="openApp('coin')">
    <span class="choice-icon">💰</span>
    <h2>Penukaran Coin Cayo</h2>
    <p>Catat penukaran coin, hitung nilai coin, dan akses panel admin.</p>
    <span class="launch">Buka aplikasi <span aria-hidden="true">→</span></span>
   </button>
  </section>
 </div>
</main>
<section id="appView" class="app-view" aria-label="Aplikasi terpilih">
 <div class="appbar">
  <button class="back" type="button" onclick="goHome()">← Kembali ke Awal</button>
  <div style="min-width:0"><div class="app-title" id="appTitle">Aplikasi</div><div class="app-subtitle">Portal Administrasi Cayo Perico</div></div>
 </div>
 <iframe id="appFrame" class="app-frame" title="Aplikasi administrasi" allow="clipboard-read; clipboard-write"></iframe>
</section>

function openApp(which) {
 const home = document.getElementById('home');
 const view = document.getElementById('appView');
 const frame = document.getElementById('appFrame');
 document.getElementById('appTitle').textContent = which === 'expense' ? 'Expense Calculator' : 'Penukaran Coin Cayo';
 frame.srcdoc = decodeURIComponent(escape(pages[which]));
 home.style.display = 'none';
 view.classList.add('active');
 window.scrollTo(0, 0);
 history.replaceState({page:which}, '', '#' + which);
}
function goHome() {
 document.getElementById('appFrame').srcdoc = '';
 document.getElementById('appView').classList.remove('active');
 document.getElementById('home').style.display = 'flex';
 window.scrollTo(0, 0);
 history.replaceState({page:'home'}, '', location.pathname + location.search);
}
window.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('appView').classList.contains('active')) goHome(); });
</script>
